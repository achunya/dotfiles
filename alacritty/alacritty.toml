[env]
# Explicitly tell applications this is alacritty to enable proper color support
TERM = "alacritty"

[window]
# Adds a bit of breathing room inside the terminal
padding = { x = 8, y = 8 }
dynamic_padding = true

# Slight transparency looks amazing with Niri's unfocus effects (1.0 is opaque)
opacity = 1

[scrolling]
# High history for checking old logs, but doesn't impact RAM until used
history = 10000
multiplier = 3

[font]
normal = { family = "JetBrainsMono Nerd Font Mono", style = "Regular" }
bold = { family = "JetBrainsMono Nerd Font Mono", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font Mono", style = "Italic" }
size = 11.0 # This base size will be automatically multiplied by Niri's 1.2 scale

[cursor]
# A modern blinking beam cursor, turns hollow when the window loses focus
style = { shape = "Beam", blinking = "On" }
unfocused_hollow = true

# --- ICEBERG COLOR SCHEME ---
[colors.primary]
background = "#161821"
foreground = "#c6c8d1"

[colors.cursor]
text = "#161821"
cursor = "#d2d4de"

[colors.normal]
black   = "#161821"
red     = "#e27878"
green   = "#b4be82"
yellow  = "#e2a478"
blue    = "#84a0c6"
magenta = "#a093c7"
cyan    = "#89b8c2"
white   = "#c6c8d1"

[colors.bright]
black   = "#6b7089"
red     = "#e98989"
green   = "#c0ca8e"
yellow  = "#e9b189"
blue    = "#91acd1"
magenta = "#ada0d3"
cyan    = "#95c4ce"
white   = "#d2d4de"

[colors.selection]
text = "#c6c8d1"
background = "#1e2132"

# Add this to your alacritty.toml
[[keyboard.bindings]]
key = "Delete"
mods = "Control"
chars = "\u001b[3;5~"

[[keyboard.bindings]]
key = "Back"
mods = "Control"
chars = "\u0017"

